<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة إدارة التدريب والتطوير النفطي — معهد التدريب النفطي / كركوك</title>
<style>
:root{--bg:#05070d;--navy:#0b1630;--gold:#d4af37;--gold2:#f1d77a;--tx:#e8ecf5;--mut:#8f9ab3;--ok:#3ecf8e;--warn:#f0b429;--bad:#ef5b5b;--info:#5aa9ff}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--tx);background:radial-gradient(1000px 600px at 80% -10%,#14234a 0,transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.glass{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.22);border-radius:16px;backdrop-filter:blur(10px);padding:16px}
.btn{background:linear-gradient(135deg,var(--gold),#a8841f);color:#111;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.g{background:transparent;color:var(--gold2);border:1px solid rgba(212,175,55,.4)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.s{padding:4px 9px;font-size:.8rem}
input,select,textarea{background:#0a1226;border:1px solid #26345c;border-radius:10px;padding:8px 10px;width:100%}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:10px}
#app{display:flex;min-height:100vh}
aside{width:240px;background:linear-gradient(180deg,#081028,#04060c);border-left:1px solid rgba(212,175,55,.25);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
aside h1{font-size:.95rem;color:var(--gold2);margin:0 4px 12px;line-height:1.6}
aside h1 small{display:block;color:var(--mut);font-weight:400}
.nav{background:none;border:0;text-align:right;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--tx)}
.nav:hover{background:rgba(255,255,255,.06)}.nav.on{background:rgba(212,175,55,.16);color:var(--gold2);border-right:3px solid var(--gold)}
main{flex:1;padding:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.top h2{margin:0;color:var(--gold2)}
#menu{display:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat b{display:block;font-size:1.9rem;color:var(--gold2)}.stat span{color:var(--mut);font-size:.85rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{width:auto;min-width:140px;flex:1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}
th{color:var(--gold);text-align:right;padding:8px;border-bottom:1px solid #26345c;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #162143;vertical-align:middle}
.tag{padding:2px 9px;border-radius:99px;font-size:.78rem;border:1px solid}
.planned{color:var(--info)}.running{color:var(--warn)}.done{color:var(--ok)}.postponed{color:var(--bad)}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.85rem}.bar i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .8s}
.bar span:first-child{width:90px;color:var(--mut)}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:10px}.cols div{flex:1;text-align:center;font-size:.7rem;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.cols i{display:block;background:linear-gradient(0deg,#a8841f,var(--gold2));border-radius:5px 5px 0 0;min-height:2px;transition:height .8s}
.empty{color:var(--mut);text-align:center;padding:26px}
.note{background:rgba(240,180,41,.1);border:1px solid var(--warn);border-radius:10px;padding:10px;font-size:.82rem;color:var(--warn);margin-bottom:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#modal>form{background:#0b1630;border:1px solid var(--gold);border-radius:16px;padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#login{max-width:380px;margin:12vh auto;padding:0 14px}#login h1{color:var(--gold2);font-size:1.15rem;text-align:center;line-height:1.7}
.fade{animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
@media(max-width:800px){aside{position:fixed;right:-260px;z-index:8;transition:right .25s}aside.open{right:0}#menu{display:inline-block}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" style="display:none"></div>
<div id="app" style="display:none">
<aside id="side"></aside>
<main><div class="top"><div><button id="menu" class="btn g" data-act="menu">☰</button> <h2 id="ttl" style="display:inline"></h2></div><div id="who"></div></div><div id="main" class="fade"></div></main>
</div>
<div id="modal"><form id="mf"></form></div>
<script>
const KEY='otm_v1',SK='otm_session';
const ST={planned:'مخططة',running:'جارية',done:'مكتملة',postponed:'مؤجلة'};
const ROLES={admin:'مدير النظام',editor:'مشرف (تعديل)',viewer:'مطّلع (قراءة فقط)'};
const DL={app:'منصة إدارة التدريب والتطوير النفطي',inst:'معهد التدريب النفطي / كركوك',dash:'لوحة التحكم',courses:'الدورات',people:'المشاركون والحضور',cal:'التقويم',reports:'التقارير',settings:'الإعدادات',
title:'اسم الدورة',organizer:'الجهة المنظمة',trainer:'المدرب',audience:'الفئة المستهدفة',start:'تاريخ البدء',end:'تاريخ الانتهاء',hours:'الساعات',seats:'المقاعد',status:'الحالة',notes:'ملاحظات',
pname:'اسم المشارك',job:'الوظيفة / القسم',course:'الدورة',attended:'أيام الحضور'};
let db=load(),S={v:'dash',q:'',f:'',year:new Date().getFullYear(),user:null,focus:null};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}return{courses:[],people:[],users:[],labels:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('تعذّر الحفظ: التخزين ممتلئ أو معطّل')}}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=k=>db.labels[k]||DL[k]||k,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const can=()=>S.user&&S.user.role!=='viewer',isAdmin=()=>S.user&&S.user.role==='admin';
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('otm|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'otm|'+s)h=(h*33^c.charCodeAt(0))>>>0;return'w'+h}}
const days=c=>c.start&&c.end?Math.max(1,Math.round((new Date(c.end)-new Date(c.start))/864e5)+1):1;
const cName=id=>(db.courses.find(c=>c.id===id)||{}).title||'—';
const tag=s=>`<span class="tag ${s}">${ST[s]}</span>`;
/* ---------- auth ---------- */
function showAuth(){
 $('#app').style.display='none';const first=!db.users.length;$('#login').style.display='block';
 $('#login').innerHTML=`<form class="glass" id="lf"><h1>${esc(L('app'))}<br><small style="color:var(--mut)">${esc(L('inst'))}</small></h1>
 ${first?'<div class="note">لا يوجد مستخدمون بعد. أنشئ حساب مدير النظام الأول.</div>':''}
 <label>اسم المستخدم<input name="u" required autocomplete="username"></label><label>كلمة المرور<input name="p" type="password" required minlength="6" autocomplete="current-password"></label>
 <button class="btn" style="width:100%">${first?'إنشاء الحساب والدخول':'دخول'}</button><p id="le" style="color:var(--bad);margin:8px 0 0"></p></form>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),u=f.get('u').trim(),h=await hash(f.get('p'));
  if(first){db.users.push({id:uid(),name:u,hash:h,role:'admin'});save();return enter(db.users[0])}
  const x=db.users.find(a=>a.name===u&&a.hash===h);x?enter(x):$('#le').textContent='بيانات الدخول غير صحيحة'}
}
function enter(u){S.user=u;sessionStorage.setItem(SK,u.id);$('#login').style.display='none';$('#app').style.display='flex';go('dash')}
/* ---------- shell ---------- */
function go(v){S.v=v;S.q='';S.f='';$('#side').classList.remove('open');render()}
function render(){
 const nav=[['dash','▦'],['courses','📚'],['people','👥'],['cal','🗓'],['reports','📊'],['settings','⚙']];
 $('#side').innerHTML=`<h1>${esc(L('app'))}<small>${esc(L('inst'))}</small></h1>`+nav.map(([k,i])=>`<button class="nav ${S.v===k?'on':''}" data-act="go" data-id="${k}">${i} ${esc(L(k))}</button>`).join('')+`<div style="flex:1"></div><button class="nav" data-act="out">⎋ خروج</button>`;
 $('#ttl').textContent=L(S.v);$('#who').innerHTML=`<span class="tag" style="color:var(--gold2)">${esc(S.user.name)} · ${ROLES[S.user.role]}</span>`;
 $('#main').innerHTML=V[S.v]();$('#main').classList.remove('fade');void $('#main').offsetWidth;$('#main').classList.add('fade');
 if(S.focus){const el=$('#'+S.focus);if(el){el.focus();el.setSelectionRange?.(el.value.length,el.value.length)}S.focus=null}
}
/* ---------- views ---------- */
const stat=(n,l)=>`<div class="glass stat"><b>${n}</b><span>${esc(l)}</span></div>`;
const none=t=>`<div class="empty">${t}</div>`;
function filtC(){const q=S.q.toLowerCase();return db.courses.filter(c=>(!S.f||c.status===S.f)&&(!q||[c.title,c.organizer,c.trainer,c.audience].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.start||'').localeCompare(a.start||''))}
function filtP(){const q=S.q.toLowerCase();return db.people.filter(p=>(!S.f||p.course===S.f)&&(!q||[p.name,p.job].join(' ').toLowerCase().includes(q)))}
const search=(opts,ph)=>`<div class="tools"><input id="q" data-act="q" placeholder="🔍 ${ph}" value="${esc(S.q)}"><select data-act="f"><option value="">الكل</option>${opts.map(([v,t])=>`<option value="${esc(v)}" ${S.f===v?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
const V={
dash(){const c=db.courses,done=c.filter(x=>x.status==='done'),max=Math.max(1,...Object.keys(ST).map(k=>c.filter(x=>x.status===k).length));
 const up=c.filter(x=>x.status!=='done'&&x.start>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,5);
 const hrs=done.reduce((s,x)=>s+(+x.hours||0)*(db.people.filter(p=>p.course===x.id).length||0),0);
 return`<div class="grid">${stat(c.length,'إجمالي الدورات')}${stat(c.filter(x=>x.status==='running').length,'دورات جارية')}${stat(db.people.length,'المشاركون المسجّلون')}${stat(c.length?Math.round(done.length/c.length*100)+'%':'—','نسبة الإنجاز')}${stat(hrs,'ساعات تدريب منجزة (ساعات × مشاركين)')}</div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="glass"><b>توزيع الدورات حسب الحالة</b>${Object.keys(ST).map(k=>{const n=c.filter(x=>x.status===k).length;return`<div class="bar"><span>${ST[k]}</span><i style="width:${n/max*60}%"></i><span>${n}</span></div>`}).join('')}</div>
 <div class="glass"><b>الدورات القادمة</b>${up.length?up.map(x=>`<p>${esc(x.title)} <small style="color:var(--mut)">— ${x.start}</small> ${tag(x.status)}</p>`).join(''):none('لا توجد دورات قادمة. أضف دورة من صفحة «الدورات».')}</div></div>`},
courses(){const r=filtC();return search(Object.entries(ST),'بحث بالاسم أو المدرب أو الجهة')+`<div class="tools">${can()?`<button class="btn" data-act="addC">＋ إضافة دورة</button>`:''}<button class="btn g" data-act="expC">⬇ تصدير CSV</button></div>
 <div class="glass tw">${r.length?`<table><tr><th>${L('title')}</th><th>${L('organizer')}</th><th>${L('trainer')}</th><th>${L('audience')}</th><th>${L('start')}</th><th>${L('end')}</th><th>${L('hours')}</th><th>${L('status')}</th><th></th></tr>`+r.map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(c.organizer)}</td><td>${esc(c.trainer)}</td><td>${esc(c.audience)}</td><td>${c.start||''}</td><td>${c.end||''}</td><td>${esc(c.hours)}</td><td>${can()?`<select data-act="st" data-id="${c.id}" style="width:auto">${Object.entries(ST).map(([k,t])=>`<option value="${k}" ${c.status===k?'selected':''}>${t}</option>`).join('')}</select>`:tag(c.status)}</td><td style="white-space:nowrap">${can()?`<button class="btn g s" data-act="editC" data-id="${c.id}">تعديل</button> <button class="btn d s" data-act="delC" data-id="${c.id}">حذف</button>`:''}</td></tr>`).join('')+'</table>':none(db.courses.length?'لا نتائج مطابقة.':'لا توجد دورات بعد.')}</div>`},
people(){const r=filtP();return search(db.courses.map(c=>[c.id,c.title]),'بحث بالاسم أو الوظيفة')+`<div class="tools">${can()?`<button class="btn" data-act="addP" ${db.courses.length?'':'disabled title="أضف دورة أولاً"'}>＋ إضافة مشارك</button>`:''}<button class="btn g" data-act="expP">⬇ تصدير CSV</button></div>
 <div class="glass tw">${r.length?`<table><tr><th>${L('pname')}</th><th>${L('job')}</th><th>${L('course')}</th><th>الحضور</th><th></th></tr>`+r.map(p=>{const c=db.courses.find(x=>x.id===p.course),d=c?days(c):1,pc=Math.min(100,Math.round((p.attended||0)/d*100));return`<tr><td>${esc(p.name)}</td><td>${esc(p.job)}</td><td>${esc(cName(p.course))}</td><td>${p.attended||0}/${d} (${pc}%) ${can()?`<button class="btn g s" data-act="att" data-id="${p.id}">＋يوم</button><button class="btn g s" data-act="attm" data-id="${p.id}">−</button>`:''}</td><td>${can()?`<button class="btn g s" data-act="editP" data-id="${p.id}">تعديل</button> <button class="btn d s" data-act="delP" data-id="${p.id}">حذف</button>`:''}</td></tr>`}).join('')+'</table>':none(db.courses.length?'لا يوجد مشاركون بعد.':'أضف دورة أولاً ثم سجّل المشاركين.')}</div>`},
cal(){const t=new Date().toISOString().slice(0,10),r=db.courses.filter(c=>c.start&&c.status!=='done'&&(c.end||c.start)>=t).sort((a,b)=>a.start.localeCompare(b.start)),g={};r.forEach(c=>(g[c.start.slice(0,7)]=g[c.start.slice(0,7)]||[]).push(c));
 return Object.keys(g).length?Object.entries(g).map(([m,l])=>`<div class="glass" style="margin-bottom:12px"><b style="color:var(--gold2)">${new Date(m+'-01').toLocaleDateString('ar-IQ',{month:'long',year:'numeric'})}</b>${l.map(c=>`<p>📅 ${c.start}${c.end?' → '+c.end:''} — ${esc(c.title)} ${tag(c.status)} <small style="color:var(--mut)">${esc(c.trainer)}</small></p>`).join('')}</div>`).join(''):`<div class="glass">${none('لا توجد دورات قادمة في التقويم.')}</div>`},
reports(){const y=S.year,cy=db.courses.filter(c=>(c.start||'').startsWith(y)),m=Array.from({length:12},(_,i)=>cy.filter(c=>+c.start.slice(5,7)===i+1).length),mx=Math.max(1,...m),dn=cy.filter(c=>c.status==='done').length;
 return`<div class="tools"><select data-act="yr" style="max-width:130px">${[y-2,y-1,y,y+1].map(v=>`<option ${v==y?'selected':''}>${v}</option>`).join('')}</select><button class="btn g" data-act="expR">⬇ تصدير التقرير</button></div>
 <div class="grid">${stat(cy.length,'دورات السنة')}${stat(dn,'مكتملة')}${stat(cy.length?Math.round(dn/cy.length*100)+'%':'—','نسبة الإنجاز')}${stat(cy.reduce((s,c)=>s+(+c.hours||0),0),'مجموع ساعات الدورات')}</div>
 <div class="glass"><b>الدورات شهرياً (حسب تاريخ البدء)</b><div class="cols">${m.map((n,i)=>`<div>${n||''}<i style="height:${n/mx*100}%"></i>${i+1}</div>`).join('')}</div></div>
 <div class="glass" style="margin-top:14px"><b>الحالات في ${y}</b>${Object.entries(ST).map(([k,t])=>`<div class="bar"><span>${t}</span><i style="width:${cy.length?cy.filter(c=>c.status===k).length/cy.length*60:0}%"></i><span>${cy.filter(c=>c.status===k).length}</span></div>`).join('')}</div>`},
settings(){return`<div class="note">⚠ النموذج الأولي يحفظ البيانات في متصفح هذا الجهاز فقط (localStorage): لا مشاركة بين الأجهزة، وتُفقد عند مسح بيانات المتصفح، وكلمات المرور هنا لا تمثل أمناً حقيقياً. للاستخدام المؤسسي الفعلي انظر README.md (خلفية + قاعدة بيانات).</div>
 ${isAdmin()?`<div class="glass" style="margin-bottom:14px"><b>أسماء الأقسام والحقول (قابلة للتعديل)</b><form data-act="lbl" class="two" style="margin-top:10px">${Object.keys(DL).map(k=>`<label>${k}<input name="${k}" value="${esc(L(k))}"></label>`).join('')}<div><button class="btn">حفظ الأسماء</button> <button type="button" class="btn g" data-act="lblReset">استعادة الافتراضي</button></div></form></div>
 <div class="glass" style="margin-bottom:14px"><b>المستخدمون والصلاحيات</b><table>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${ROLES[u.role]}</td><td>${u.id!==S.user.id?`<button class="btn d s" data-act="delU" data-id="${u.id}">حذف</button>`:''}</td></tr>`).join('')}</table><button class="btn" style="margin-top:10px" data-act="addU">＋ مستخدم</button></div>
 <div class="glass"><b>نسخة احتياطية</b><div class="tools" style="margin-top:10px"><button class="btn g" data-act="bak">⬇ تنزيل JSON</button><button class="btn g" data-act="rest">⬆ استعادة</button><button class="btn d" data-act="wipe">مسح كل البيانات</button></div></div>`:'<div class="glass">الإعدادات متاحة لمدير النظام فقط.</div>'}`}
};
/* ---------- forms ---------- */
function form(title,fields,vals,ok){
 $('#mf').innerHTML=`<h3 style="color:var(--gold2);margin-top:0">${esc(title)}</h3><div class="two">`+fields.map(([k,l,t,o])=>`<label style="${t==='textarea'?'grid-column:1/-1':''}">${esc(l)}${t==='select'?`<select name="${k}" required>${o.map(([v,x])=>`<option value="${esc(v)}" ${vals[k]===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${k}" rows="2">${esc(vals[k])}</textarea>`:`<input name="${k}" type="${t}" value="${esc(vals[k])}" ${t==='number'?'min="0"':''} ${k==='title'||k==='name'||k==='pname'||t==='password'?'required':''}>`}</label>`).join('')+`</div><button class="btn">حفظ</button> <button type="button" class="btn g" data-act="close">إلغاء</button>`;
 $('#modal').style.display='flex';$('#mf').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));
  if(o.start&&o.end&&o.end<o.start)return alert('تاريخ الانتهاء قبل تاريخ البدء');ok(o)}}
const closeM=()=>$('#modal').style.display='none';
const cF=()=>[['title',L('title'),'text'],['organizer',L('organizer'),'text'],['trainer',L('trainer'),'text'],['audience',L('audience'),'text'],['start',L('start'),'date'],['end',L('end'),'date'],['hours',L('hours'),'number'],['seats',L('seats'),'number'],['status',L('status'),'select',Object.entries(ST)],['notes',L('notes'),'textarea']];
const pF=()=>[['name',L('pname'),'text'],['job',L('job'),'text'],['course',L('course'),'select',db.courses.map(c=>[c.id,c.title])],['attended',L('attended'),'number']];
function csv(name,head,rows){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl(name,'\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m+';charset=utf-8'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
/* ---------- actions ---------- */
const A={
go:id=>go(id),menu:()=>$('#side').classList.toggle('open'),close:closeM,
out:()=>{sessionStorage.removeItem(SK);S.user=null;showAuth()},
addC:()=>form('إضافة دورة',cF(),{status:'planned'},o=>{db.courses.push({id:uid(),...o});save();closeM();render()}),
editC:id=>{const c=db.courses.find(x=>x.id===id);form('تعديل دورة',cF(),c,o=>{Object.assign(c,o);save();closeM();render()})},
delC:id=>{if(confirm('حذف الدورة وجميع مشاركيها؟')){db.courses=db.courses.filter(c=>c.id!==id);db.people=db.people.filter(p=>p.course!==id);save();render()}},
st:(id,el)=>{db.courses.find(c=>c.id===id).status=el.value;save();render()},
addP:()=>form('إضافة مشارك',pF(),{attended:0},o=>{db.people.push({id:uid(),...o,attended:+o.attended||0});save();closeM();render()}),
editP:id=>{const p=db.people.find(x=>x.id===id);form('تعديل مشارك',pF(),p,o=>{Object.assign(p,o,{attended:+o.attended||0});save();closeM();render()})},
delP:id=>{if(confirm('حذف المشارك؟')){db.people=db.people.filter(p=>p.id!==id);save();render()}},
att:id=>{const p=db.people.find(x=>x.id===id);p.attended=(p.attended||0)+1;save();render()},
attm:id=>{const p=db.people.find(x=>x.id===id);p.attended=Math.max(0,(p.attended||0)-1);save();render()},
q:(id,el)=>{S.q=el.value;S.focus='q';render()},f:(id,el)=>{S.f=el.value;render()},yr:(id,el)=>{S.year=+el.value;render()},
expC:()=>csv('courses.csv',[L('title'),L('organizer'),L('trainer'),L('audience'),L('start'),L('end'),L('hours'),L('seats'),L('status'),L('notes')],filtC().map(c=>[c.title,c.organizer,c.trainer,c.audience,c.start,c.end,c.hours,c.seats,ST[c.status],c.notes])),
expP:()=>csv('participants.csv',[L('pname'),L('job'),L('course'),L('attended')],filtP().map(p=>[p.name,p.job,cName(p.course),p.attended])),
expR:()=>{const y=S.year;csv('report-'+y+'.csv',['الشهر','عدد الدورات','المكتملة'],Array.from({length:12},(_,i)=>{const l=db.courses.filter(c=>(c.start||'').startsWith(y)&&+c.start.slice(5,7)===i+1);return[i+1,l.length,l.filter(c=>c.status==='done').length]}))},
addU:()=>form('مستخدم جديد',[['name','اسم المستخدم','text'],['pw','كلمة المرور (6+ أحرف)','password'],['role','الصلاحية','select',Object.entries(ROLES)]],{role:'viewer'},async o=>{if(o.pw.length<6)return alert('كلمة المرور قصيرة');if(db.users.some(u=>u.name===o.name))return alert('الاسم موجود');db.users.push({id:uid(),name:o.name,hash:await hash(o.pw),role:o.role});save();closeM();render()}),
delU:id=>{if(confirm('حذف المستخدم؟')){db.users=db.users.filter(u=>u.id!==id);save();render()}},
lblReset:()=>{db.labels={};save();render()},
bak:()=>dl('backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db),'application/json'),
rest:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.courses)||!Array.isArray(d.people)||!Array.isArray(d.users))throw 0;if(!d.users.some(u=>u.id===S.user.id)){alert('النسخة لا تحتوي حسابك الحالي؛ ستحتاج الدخول بحساباتها.')}db=d;db.labels=db.labels||{};save();render()}catch(e){alert('ملف غير صالح')}});i.click()},
wipe:()=>{if(confirm('سيتم مسح كل الدورات والمشاركين والمستخدمين نهائياً. متابعة؟')){localStorage.removeItem(KEY);db=load();A.out()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.matches('select,input,form'))return;if(A[b.dataset.act])A[b.dataset.act](b.dataset.id,b)});
document.addEventListener('input',e=>{const b=e.target.closest('[data-act]');if(b&&b.matches('input')&&A[b.dataset.act])A[b.dataset.act](b.dataset.id,b)});
document.addEventListener('change',e=>{const b=e.target.closest('[data-act]');if(b&&b.matches('select')&&A[b.dataset.act])A[b.dataset.act](b.dataset.id,b)});
document.addEventListener('submit',e=>{if(e.target.dataset.act==='lbl'){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));db.labels={};for(const k in o)if(o[k].trim()&&o[k].trim()!==DL[k])db.labels[k]=o[k].trim();save();render()}});
const sid=sessionStorage.getItem(SK),su=db.users.find(u=>u.id===sid);su?enter(su):showAuth();
</script>
</body>
</html>
